<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NZIP 设备管理</title><link rel="stylesheet" href="/manage.css"><main><h1>NZIP 设备管理</h1><p>使用购买邮箱验证，无需注册账号。解绑成功后立即释放名额，可在新电脑激活。</p><form id="verify"><label>购买邮箱<input id="email" type="email" required autocomplete="email"></label><button id="send" type="button">发送验证码</button><label>邮箱验证码<input id="code" inputmode="numeric" pattern="[0-9]{6}" required autocomplete="one-time-code"></label><button>验证并查看设备</button></form><p id="status" role="status"></p><section id="devices"></section><p>解绑不能使已保存的永久离线凭证远程失效。请仅管理您自己的设备。</p></main><script src="/manage.js"></script></html>
