<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>NZIP</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="classic.css">
</head>
<body>
  <header class="titlebar">
    <div class="titlebrand"><span class="mini-logo">N</span><span id="window-title">NZIP</span></div>
    <div class="window-controls"><button data-window="minimize" aria-label="最小化">−</button><button data-window="maximize" aria-label="最大化">□</button><button data-window="close" class="close" aria-label="关闭">×</button></div>
  </header>
  <nav class="menubar" aria-label="主菜单">
    <details class="menu" id="menu-file"><summary>文件(F)</summary><div class="menu-popup">
      <button data-command="open">打开压缩包…<kbd>Ctrl+O</kbd></button><button data-command="new">新建压缩包…<kbd>Ctrl+N</kbd></button><hr>
      <button class="nav-item" data-view="archive">当前压缩包<span id="archive-badge"></span></button><button class="nav-item" data-view="home">最近打开</button>
      <button data-command="close-archive" data-needs-archive>关闭压缩包</button><button data-command="properties" data-needs-archive>压缩包属性…</button><button data-command="reveal" data-needs-archive>打开所在文件夹</button><hr><button data-window="close">退出</button>
    </div></details>
    <details class="menu" id="menu-edit"><summary>编辑(E)</summary><div class="menu-popup">
      <button data-command="select-all" data-needs-archive>全选<kbd>Ctrl+A</kbd></button><button data-command="invert" data-needs-archive>反向选择</button><button data-command="copy-names" data-needs-selection>复制文件路径<kbd>Ctrl+C</kbd></button><hr><button data-command="rename" data-needs-selection>重命名…<kbd>F2</kbd></button><button data-command="delete" data-needs-selection>删除<kbd>Delete</kbd></button>
    </div></details>
    <details class="menu" id="menu-find"><summary>查找(S)</summary><div class="menu-popup"><button data-command="search" data-needs-archive>查找文件…<kbd>Ctrl+F</kbd></button><button data-command="clear-search" data-needs-archive>清除搜索</button></div></details>
    <details class="menu" id="menu-options"><summary>选项(O)</summary><div class="menu-popup"><button class="nav-item" data-view="settings">设置…</button><button data-command="codepage" data-needs-archive>文件名代码页…</button></div></details>
    <details class="menu" id="menu-view"><summary>视图(V)</summary><div class="menu-popup"><button data-command="details">详细信息</button><button data-command="icons">大图标</button><button data-command="tree">显示 / 隐藏目录树</button><hr><button data-command="refresh" data-needs-archive>刷新<kbd>F5</kbd></button><button data-command="preview" data-needs-selection>预览选中文件</button><button class="nav-item" data-view="tasks">任务记录<span id="task-badge"></span></button></div></details>
    <details class="menu" id="menu-tools"><summary>工具(T)</summary><div class="menu-popup"><button data-command="extract" data-needs-archive>解压到…</button><button id="extract-selected" data-command="extract-selected" data-needs-selection>解压选中文件…</button><button data-command="quick-extract" data-needs-archive>解压到同名文件夹</button><button data-command="batch">批量解压…</button><hr><button data-command="test" data-needs-archive>测试压缩包</button><button data-command="scan" data-needs-archive>扫描压缩包…</button></div></details>
    <details class="menu" id="menu-help"><summary>帮助(H)</summary><div class="menu-popup"><button data-command="help">使用说明与功能支持</button><button data-command="about">关于 NZIP…<span class="version">v0.4.0</span></button></div></details>
  </nav>
  <div class="ribbon" role="toolbar" aria-label="压缩工具栏">
    <button id="open-archive" data-command="open"><span data-icon="openDocument"></span><span>打开</span></button>
    <button id="extract-all" data-command="extract" data-needs-archive><span data-icon="extractDocument"></span><span>解压</span></button>
    <button id="new-archive" data-command="new"><span data-icon="newDocument"></span><span>新建</span></button>
    <button id="add-archive" data-command="add" data-needs-editable><span data-icon="addDocument"></span><span>添加</span></button>
    <button id="delete-entries" data-command="delete" data-needs-selection data-needs-editable><span data-icon="deleteDocument"></span><span>删除</span></button>
    <button id="test-archive" data-command="test" data-needs-archive><span data-icon="bolt"></span><span>测试</span></button>
    <button id="scan-archive" data-command="scan" data-needs-archive><span data-icon="shield"></span><span>扫描</span></button>
    <button id="view-archive" data-command="preview" data-needs-selection><span data-icon="list"></span><span>查看</span></button>
    <button id="codepage-archive" data-command="codepage" data-needs-archive><span data-icon="globe"></span><span>代码页</span></button>
  </div>
  <div class="shell">
    <main id="main" tabindex="-1"></main>
  </div>
  <footer class="statusbar"><div id="status-text">已就绪</div><div class="status-right"><button data-command="details" title="详细信息" aria-label="详细信息"><span data-icon="layers"></span></button><button data-command="icons" title="大图标" aria-label="大图标"><span data-icon="image"></span></button><button data-command="tree" title="目录树" aria-label="目录树"><span data-icon="folder"></span></button><span id="archive-summary">无广告 · 本地处理</span></div></footer>
  <div id="drop-overlay"><span data-icon="download"></span><h2>松开，交给 NZIP</h2><p>打开压缩包，或将文件打包压缩</p></div>
  <div id="toast-region" aria-live="polite"></div>
  <dialog id="modal"></dialog>
  <div id="file-context" class="menu-popup" role="menu" hidden></div>
  <script src="native-bridge.js"></script>
  <script src="app.js"></script>
  <script src="classic.js"></script>
</body>
</html>
